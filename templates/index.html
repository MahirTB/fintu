{% extends 'base.html' %}

{% block content %}
<!-- Filter Options Header with Quick Add Dropdown -->
<div class="filter-row">
    <div class="overview-header-group">
        <h2>Financial Overview</h2>
        <button type="button" class="quick-add-btn" id="quick-add-btn" onclick="openTransactionModal('income')" title="Add Transaction (N)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>Add</span>
        </button>
    </div>

    <div class="period-filters">
        <button class="filter-pill active" 
                id="filter-current_month" 
                hx-get="/summary?filter=current_month" 
                hx-target="#summary-section"
                hx-swap="outerHTML"
                onclick="setActiveFilter('current_month')">This Month</button>
        <button class="filter-pill" 
                id="filter-7_days" 
                hx-get="/summary?filter=7_days" 
                hx-target="#summary-section"
                hx-swap="outerHTML"
                onclick="setActiveFilter('7_days')">Last 7 Days</button>
        <button class="filter-pill" 
                id="filter-14_days" 
                hx-get="/summary?filter=14_days" 
                hx-target="#summary-section"
                hx-swap="outerHTML"
                onclick="setActiveFilter('14_days')">Last 14 Days</button>
        <button class="filter-pill" 
                id="filter-all_time" 
                hx-get="/summary?filter=all_time" 
                hx-target="#summary-section"
                hx-swap="outerHTML"
                onclick="setActiveFilter('all_time')">All Time</button>
    </div>
</div>

<!-- Stats Cards Section -->
{% include 'partials/summary.html' %}

<!-- Main Grid Section -->
<main class="main-grid">
    <!-- History Card (Recent Activity) -->
    <section class="history-card">
        <div class="history-card-header">
            <div class="history-title-wrap">
                <h2>Recent Activity</h2>
                <span class="period-subtitle" id="activity-period-label">{{ period.display_name if period else 'This Month' }}</span>
            </div>
        </div>
        <div class="transaction-list-container">
            {% include 'partials/transaction_list.html' %}
        </div>
    </section>

    <!-- Spending Breakdown Card -->
    {% include 'partials/breakdown.html' %}
</main>

<!-- Transaction Modal (Popup Dialog) -->
<div id="transaction-modal" class="modal-overlay" onclick="handleModalBackdropClick(event)">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
            <h3 id="modal-title">Add Transaction</h3>
            <button type="button" class="modal-close-btn" onclick="closeTransactionModal()" title="Close (Esc)">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        
        <div class="form-tabs">
            <button type="button" class="tab-btn active" id="tab-income" onclick="switchTab('income')">Income</button>
            <button type="button" class="tab-btn" id="tab-expense" onclick="switchTab('expense')">Expense</button>
        </div>
        
        <form id="transaction-form" 
              hx-post="/transactions" 
              hx-target="#transaction-list" 
              hx-swap="outerHTML"
              autocomplete="off">
            
            <input type="hidden" name="type" id="form-type" value="income">
            
            <div class="form-group">
                <label for="form-category">Category</label>
                <select name="category" id="form-category" required>
                    <!-- Toggled via JS -->
                </select>
            </div>
            
            <div class="form-group">
                <label for="form-amount">Amount (৳)</label>
                <input type="number" step="1" min="1" name="amount" id="form-amount" placeholder="0" autocomplete="off" required>
            </div>
            
            <div class="form-group">
                <label for="form-comment">Comment</label>
                <input type="text" name="comment" id="form-comment" maxlength="60" placeholder="Add a short note..." autocomplete="off">
            </div>
            
            <button type="submit" class="submit-btn" id="submit-btn">
                <!-- Toggled via JS -->
            </button>
        </form>
    </div>
</div>

<!-- Mobile Floating Action Button (FAB) -->
<button type="button" class="mobile-fab" onclick="openTransactionModal('income')" title="Add Transaction">
    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<script>
    function clearFormInputs() {
        const form = document.getElementById('transaction-form');
        if (form) form.reset();
        const amountInput = document.getElementById('form-amount');
        const commentInput = document.getElementById('form-comment');
        if (amountInput) {
            amountInput.value = '';
            amountInput.defaultValue = '';
        }
        if (commentInput) {
            commentInput.value = '';
            commentInput.defaultValue = '';
        }
    }

    function setActiveFilter(id) {
        document.querySelectorAll('.filter-pill').forEach(btn => {
            btn.classList.remove('active');
        });
        const pill = document.getElementById('filter-' + id);
        if (pill) pill.classList.add('active');
    }

    function openTransactionModal(type = 'income') {
        clearFormInputs();
        switchTab(type);
        const modal = document.getElementById('transaction-modal');
        if (modal) {
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            setTimeout(() => {
                clearFormInputs();
                const amountInput = document.getElementById('form-amount');
                if (amountInput) amountInput.focus();
            }, 60);
        }
    }

    function closeTransactionModal() {
        clearFormInputs();
        const modal = document.getElementById('transaction-modal');
        if (modal) {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }
    }

    function handleModalBackdropClick(e) {
        if (e.target.id === 'transaction-modal') {
            closeTransactionModal();
        }
    }

    // HTMX after-request and after-onload listeners to guarantee form resets
    document.addEventListener('htmx:afterOnLoad', function (evt) {
        if (evt.detail && evt.detail.elt && evt.detail.elt.id === 'transaction-form') {
            clearFormInputs();
            closeTransactionModal();
            setActiveFilter('current_month');
        }
    });

    document.addEventListener('htmx:afterRequest', function (evt) {
        if (evt.target && evt.target.id === 'transaction-form') {
            clearFormInputs();
            closeTransactionModal();
            setActiveFilter('current_month');
        }
    });

    // Keyboard shortcuts: Esc to close modal, N to open modal
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeTransactionModal();
        } else if ((e.key === 'n' || e.key === 'N') && !['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
            e.preventDefault();
            openTransactionModal('income');
        }
    });

    const incomeCategories = [
        { value: 'job', label: 'Job' },
        { value: 'business', label: 'Business' },
        { value: 'gig', label: 'Gig' },
        { value: 'salami', label: 'Salami' },
        { value: 'gift', label: 'Gift' },
        { value: 'other', label: 'Other' }
    ];
    
    const expenseCategories = [
        { value: 'commute', label: 'Commute' },
        { value: 'grocery', label: 'Grocery' },
        { value: 'food', label: 'Food' },
        { value: 'shopping', label: 'Shopping' },
        { value: 'rent', label: 'Rent' },
        { value: 'utilities', label: 'Utilities' },
        { value: 'other', label: 'Other' }
    ];
    
    function switchTab(type) {
        // Update active tab button style
        document.getElementById('tab-income').classList.toggle('active', type === 'income');
        document.getElementById('tab-expense').classList.toggle('active', type === 'expense');
        
        // Update hidden input type value
        document.getElementById('form-type').value = type;
        
        // Populate correct categories dropdown
        const select = document.getElementById('form-category');
        select.innerHTML = '';
        const categories = type === 'income' ? incomeCategories : expenseCategories;
        
        categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.value;
            opt.textContent = cat.label;
            select.appendChild(opt);
        });
        
        // Update primary submit button text/icon and background color
        const btn = document.getElementById('submit-btn');
        if (type === 'income') {
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Income`;
            btn.style.backgroundColor = 'var(--income-color)';
        } else {
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add Expense`;
            btn.style.backgroundColor = 'var(--expense-color)';
        }
    }
    
    // Set initial category elements
    document.addEventListener('DOMContentLoaded', () => {
        switchTab('income');
    });
</script>
{% endblock %}
